apiVersion: v1
kind: Service
metadata:
  name: beleganski-jaas
  labels:
    app: beleganski-jaas
spec:
  selector:
    app: beleganski-jaas
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  # Kept as NodePort until it's confirmed nothing (e.g. Nginx Proxy Manager) targets the node port
  # directly; traffic via the Traefik Ingress only needs ClusterIP.
  type: NodePort
