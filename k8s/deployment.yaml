apiVersion: apps/v1
kind: Deployment
metadata:
  name: beleganski-jaas
  labels:
    app: beleganski-jaas
    app.kubernetes.io/name: beleganski-jaas
    version: jacuzzi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: beleganski-jaas        # immutable, do not change
  template:
    metadata:
      labels:
        app: beleganski-jaas
        app.kubernetes.io/name: beleganski-jaas   # Homepage discovery
        version: jacuzzi
    spec:
      # Spread replicas across nodes; still schedules if there are fewer nodes than replicas
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: beleganski-jaas
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # nginx user in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beleganski-jaas
          # Tag is set by CI in k8s/kustomization.yaml (images: newTag)
          image: dporkov/beleganski-jaas
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          volumeMounts:
            - name: tmp               # nginx pid + temp files (read-only root FS)
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
