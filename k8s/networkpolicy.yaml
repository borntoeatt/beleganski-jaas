apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beleganski-jaas
  labels:
    app: beleganski-jaas
spec:
  podSelector:
    matchLabels:
      app: beleganski-jaas
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homepage
      ports:
        - protocol: TCP
          port: 8080
  egress: []
